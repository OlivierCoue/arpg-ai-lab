[workspace]
resolver = "2"
members = ["crates/game"]

[workspace.dependencies]
bevy = "0.19"

# Enable max optimizations for dependencies, but not for our code.
[profile.dev.package."*"]
opt-level = 3

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

[workspace.lints.clippy]
type_complexity = "allow"